<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Nearest Plane</title>
  <style>
    :root {
      --fg: #eee;
      --muted: #999;
      --line: #333;
      --btn: #2a2a2a;
      --btn-hover: #3a3a3a;
      --accent: #7eb8ff;
      --bg-top: rgba(17, 17, 17, 0.85);
      --bg-bottom: rgba(17, 17, 17, 0.35);
      --panel-radius: 4px;
      /* Scales down aggressively in small embeds */
      --fs: clamp(10px, 2.4vh, 12px);
      --fs-title: clamp(16px, 3.4vh, 22px);
      --fs-route: clamp(8px, 2.4vh, 12px);
      --fs-small: clamp(8px, 1.6vh, 9px);
      --pad: clamp(4px, 1.2vh, 10px);
      --gap: clamp(1px, 0.5vh, 6px);
      --row-label: clamp(28px, 14vw, 48px);
      --btn-size: clamp(8px, 2.6vh, 12px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--fg);
      font: var(--fs)/1.25 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: var(--pad);
      gap: var(--gap);
      min-height: 0;
      height: 100%;
      max-height: 100%;
      background: transparent;
      isolation: isolate;
    }
    body::before,
    body::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: -1;
      border-radius: var(--panel-radius);
    }
    /* Top panel (~28%) */
    body::before {
      top: 0;
      height: 30%;
      background: var(--bg-top);
    }
    /* Bottom panel (below 5% clear gap) */
    body::after {
      top: 36%;
      bottom: 0;
      background: var(--bg-bottom);
    }
    main,
    footer {
      position: relative;
      z-index: 1;
    }
    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      -webkit-overflow-scrolling: touch;
    }
    #status {
      color: var(--muted);
      font-size: var(--fs-small);
    }
    #status.error { color: #f88; }
    #card { display: none; }
    #card.visible { display: block; }
    .headline {
      text-align: center;
      margin: 0 0 0.5em;
    }
    .callsign {
      font-size: var(--fs-title);
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
    }
    .route-line {
      font-size: calc(var(--fs-title) - 6px);
      font-weight: 400;
      color: #fff;
      line-height: 1.2;
      margin: 0.15em 0 0;
      min-height: 1.2em;
      white-space: nowrap;
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: var(--row-label) 1fr;
      gap: 1px var(--gap);
      margin: 1px 0;
      font-size: var(--fs);
    }
    .row .label { color: var(--fg); }
    .row .value {
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    footer {
      display: flex;
      gap: 3px;
      border-top: 1px solid var(--line);
      padding-top: 3px;
      flex: 0 0 auto;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--btn);
      color: var(--fg);
      font: inherit;
      font-weight: 600;
      padding: 4px 6px;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover { background: var(--btn-hover); }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    footer button.icon-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--btn-size) + 8px);
      min-height: 18px;
      max-height: 24px;
      padding: 2px;
      color: #fff;
      background: #1a1a1a;
      border-color: #444;
      line-height: 0;
    }
    footer button.icon-btn:hover {
      background: #2a2a2a;
    }
    footer button.icon-btn svg {
      width: var(--btn-size);
      height: var(--btn-size);
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #setup {
      display: none;
      flex-direction: column;
      gap: var(--gap);
    }
    #setup.visible { display: flex; }
    #setup label {
      font-size: var(--fs-small);
      color: var(--muted);
    }
    #setup input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid var(--line);
      color: var(--fg);
      padding: 4px;
      border-radius: 3px;
      font: inherit;
    }
  </style>
</head>
<body>
  <main>
    <div id="status"></div>

    <div id="setup">
      <label for="lat">Latitude</label>
      <input id="lat" type="number" step="any" placeholder="43.319" />
      <label for="lon">Longitude</label>
      <input id="lon" type="number" step="any" placeholder="-79.832" />
      <button type="button" id="use-location">Use these coordinates</button>
      <button type="button" id="use-gps">Request GPS location</button>
    </div>

    <div id="card">
      <div class="headline">
        <p class="callsign" id="callsign">—</p>
        <p class="route-line" id="route"></p>
      </div>
      <div class="row"><span class="label">Type</span><span class="value" id="type">—</span></div>
      <div class="row"><span class="label">Alt</span><span class="value" id="alt">—</span></div>
      <div class="row"><span class="label">Speed</span><span class="value" id="speed">—</span></div>
      <div class="row"><span class="label">Pos</span><span class="value" id="dist">—</span></div>
    </div>
  </main>

  <footer>
    <button type="button" class="icon-btn" id="nearest" aria-label="Nearest" title="Nearest">
      <!-- crosshair / find nearest -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7" />
        <circle cx="12" cy="12" r="2.25" fill="currentColor" stroke="none" />
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
      </svg>
    </button>
    <button type="button" class="icon-btn" id="refresh" aria-label="Refresh" title="Refresh">
      <!-- refresh -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.2-5.5" />
        <path d="M20 4v5h-5" />
      </svg>
    </button>
    <button type="button" class="icon-btn" id="next" aria-label="Next" title="Next" disabled>
      <!-- next -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 5l10 7-10 7V5z" />
        <path d="M19 5v14" />
      </svg>
    </button>
  </footer>

  <script>
    const RADIUS_NM = 150; // nautical miles (~173 mi). API max is typically 250.
    const REFRESH_MS = 30000;
    const LATCH_MS = 5 * 60 * 1000; // keep selected aircraft this long after a button press
    const MIN_ALT_FT = 200;
    const VERT_RATE_LEVEL_FPM = 150; // treat |vs| below this as level flight
    const DEFAULT_LAT = 43.319;
    const DEFAULT_LON = -79.832;

    const ADSB_URLS = [
      (lat, lon) => `https://opendata.adsb.fi/api/v2/lat/${lat}/lon/${lon}/dist/${RADIUS_NM}`,
      (lat, lon) => `https://api.adsb.lol/v2/point/${lat}/${lon}/${RADIUS_NM}`,
    ];

    const el = {
      status: document.getElementById("status"),
      setup: document.getElementById("setup"),
      card: document.getElementById("card"),
      callsign: document.getElementById("callsign"),
      type: document.getElementById("type"),
      alt: document.getElementById("alt"),
      speed: document.getElementById("speed"),
      dist: document.getElementById("dist"),
      route: document.getElementById("route"),
      next: document.getElementById("next"),
      refresh: document.getElementById("refresh"),
      nearest: document.getElementById("nearest"),
      lat: document.getElementById("lat"),
      lon: document.getElementById("lon"),
      useLocation: document.getElementById("use-location"),
      useGps: document.getElementById("use-gps"),
    };

    const state = {
      lat: null,
      lon: null,
      locationSource: null, // "gps" | "url" | "manual"
      accuracyM: null,
      planes: [],
      rawCount: 0,
      index: 0,
      timer: null,
      lastInteractionAt: 0,
      routeCache: new Map(),
      callsignCache: new Map(), // ICAO → telephony name from 123atc.com
    };

    function setStatus(msg, isError = false) {
      el.status.textContent = msg;
      el.status.classList.toggle("error", isError);
      el.status.style.display = msg ? "block" : "none";
    }

    function fmtNum(n, digits = 0) {
      if (n == null || Number.isNaN(n)) return "—";
      return Number(n).toLocaleString(undefined, {
        maximumFractionDigits: digits,
        minimumFractionDigits: digits,
      });
    }

    function haversineNm(lat1, lon1, lat2, lon2) {
      const toRad = (d) => (d * Math.PI) / 180;
      const R = 3440.065; // Earth radius in nautical miles
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function bearingDeg(lat1, lon1, lat2, lon2) {
      const toRad = (d) => (d * Math.PI) / 180;
      const toDeg = (r) => (r * 180) / Math.PI;
      const φ1 = toRad(lat1);
      const φ2 = toRad(lat2);
      const Δλ = toRad(lon2 - lon1);
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x =
        Math.cos(φ1) * Math.sin(φ2) -
        Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function compassFromDeg(deg) {
      if (!Number.isFinite(deg)) return null;
      const points = [
        "N", "NNE", "NE", "ENE",
        "E", "ESE", "SE", "SSE",
        "S", "SSW", "SW", "WSW",
        "W", "WNW", "NW", "NNW",
      ];
      const idx = Math.round(deg / 22.5) % 16;
      return points[idx];
    }

    function cleanAircraftType(desc) {
      if (!desc) return null;
      return String(desc)
        .replace(/\s*\((?:long|short)\s*wing\)\s*/gi, " ")
        .replace(/\s{2,}/g, " ")
        .trim() || null;
    }

    function normalizePlane(raw, originLat, originLon) {
      const lat = raw.lat;
      const lon = raw.lon;
      if (lat == null || lon == null) return null;

      let alt = raw.alt_baro;
      if (alt === "ground") return null;
      alt = Number(alt);
      if (!Number.isFinite(alt)) {
        alt = Number(raw.alt_geom);
      }
      if (!Number.isFinite(alt) || alt < MIN_ALT_FT) return null;

      const callsign = (raw.flight || "").trim() || null;
      const registration = (raw.r || "").trim() || null;
      if (!callsign && !registration) return null;

      const gs = raw.gs != null ? Number(raw.gs) : null;
      let dist = raw.dst != null ? Number(raw.dst) : null;
      if (!Number.isFinite(dist)) {
        dist = haversineNm(originLat, originLon, lat, lon);
      }

      let bearing = raw.dir != null ? Number(raw.dir) : null;
      if (!Number.isFinite(bearing)) {
        bearing = bearingDeg(originLat, originLon, lat, lon);
      }

      const typeCode = (raw.t || "").trim() || null;
      const typeDesc = cleanAircraftType((raw.desc || "").trim() || null);

      let vs = raw.baro_rate != null ? Number(raw.baro_rate) : NaN;
      if (!Number.isFinite(vs)) {
        vs = raw.geom_rate != null ? Number(raw.geom_rate) : NaN;
      }

      return {
        hex: (raw.hex || "").toLowerCase(),
        callsign,
        registration,
        typeCode,
        typeDesc,
        alt,
        vs: Number.isFinite(vs) ? vs : null,
        gs: Number.isFinite(gs) ? gs : null,
        dist,
        bearing,
        lat,
        lon,
      };
    }

    async function fetchJson(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    /** ADS-B APIs often omit CORS; jina.ai returns the body with CORS enabled. */
    async function fetchViaJina(url) {
      const res = await fetch(`https://r.jina.ai/${url}`, {
        headers: { Accept: "application/json" },
        cache: "no-store",
      });
      if (!res.ok) throw new Error(`Proxy HTTP ${res.status}`);
      const wrap = await res.json();
      const content = wrap?.data?.content;
      if (!content) throw new Error("Empty proxy response");
      return JSON.parse(content);
    }

    async function fetchAircraftData(lat, lon) {
      let lastError = null;
      for (const makeUrl of ADSB_URLS) {
        const url = makeUrl(lat, lon);
        try {
          return await fetchJson(url);
        } catch (err) {
          lastError = err;
        }
        try {
          return await fetchViaJina(url);
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("No aircraft data");
    }

    function planesFromResponse(data, lat, lon) {
      const list = data.aircraft || data.ac || [];
      state.rawCount = list.length;
      return list
        .map((raw) => normalizePlane(raw, lat, lon))
        .filter(Boolean)
        .sort((a, b) => a.dist - b.dist);
    }

    // Seed / overrides for common operators. Unknown prefixes are resolved
    // on demand from https://123atc.com/call-signs/ (telephony call signs).
    const AIRLINES = {
      JZA: "Jazz",
      ROU: "Rouge",
      ACA: "Air Canada",
      WJA: "WestJet",
      WEN: "WestJet Encore",
      TSC: "Air Transat",
      FLE: "Flair",
      POE: "Porter",
      PJT: "Porter",
      VJA: "Iconic",
      VJT: "VistaJet",
      ASP: "AirSprint",
      CAV: "Calm Air",
      PCO: "Pacific Coastal",
      CJT: "Cargojet",
      UAL: "United",
      AAL: "American",
      DAL: "Delta",
      SWA: "Southwest",
      JBU: "JetBlue",
      ASA: "Alaska",
      FFT: "Frontier",
      NKS: "Spirit",
      SCX: "Sun Country",
      HAL: "Hawaiian",
      MXY: "Breeze",
      SKW: "SkyWest",
      RPA: "Republic",
      ENY: "Envoy",
      PDT: "Piedmont",
      JIA: "PSA",
      ASH: "Mesa",
      GJS: "GoJet",
      EDV: "Endeavor",
      QXE: "Horizon",
      BAW: "British Airways",
      VIR: "Virgin Atlantic",
      AFR: "Air France",
      KLM: "KLM",
      DLH: "Lufthansa",
      EIN: "Aer Lingus",
      ICE: "Icelandair",
      SAS: "SAS",
      IBE: "Iberia",
      RYR: "Ryanair",
      EZY: "easyJet",
      EWG: "Eurowings",
      AUA: "Austrian",
      SWR: "Swiss",
      TAP: "TAP",
      FIN: "Finnair",
      LOT: "LOT",
      THY: "Turkish",
      UAE: "Emirates",
      QTR: "Qatar",
      ETD: "Etihad",
      SIA: "Singapore",
      CPA: "Cathay Pacific",
      ANA: "ANA",
      JAL: "JAL",
      QFA: "Qantas",
      ANZ: "Air New Zealand",
      AMX: "Aeromexico",
      CMP: "Copa",
      AVA: "Avianca",
      FDX: "FedEx",
      UPS: "UPS",
      GTI: "Atlas Air",
      EJA: "NetJets",
      LXJ: "Flexjet",
    };

    function shortAirlineName(name) {
      if (!name) return null;
      const n = String(name).trim();
      const aliases = [
        [/air canada rouge/i, "Rouge"],
        [/jazz aviation/i, "Jazz"],
        [/air canada express/i, "Jazz"],
        [/united airlines/i, "United"],
        [/american airlines/i, "American"],
        [/delta air lines/i, "Delta"],
        [/southwest airlines/i, "Southwest"],
        [/jetblue airways/i, "JetBlue"],
        [/westjet(?: airlines)?/i, "WestJet"],
        [/alaska airlines/i, "Alaska"],
      ];
      for (const [re, label] of aliases) {
        if (re.test(n)) return label;
      }
      return n
        .replace(/\s+(Airlines|Airline|Airways|Aviation|Ltd\.?|Limited|Inc\.?|LP|Corp\.?)\s*$/i, "")
        .trim();
    }

    function parseAirlineCallsign(callsign) {
      if (!callsign) return null;
      const cs = callsign.toUpperCase().replace(/\s+/g, "");
      // e.g. UAL1227, ACA601, JZA8591
      const m = cs.match(/^([A-Z]{3})(\d{1,4}[A-Z]?)$/);
      if (!m) return null;
      return { icao: m[1], flightNo: m[2] };
    }

    function titleCaseCallsign(name) {
      if (!name) return name;
      const cleaned = String(name).replace(/\s+/g, " ").trim();
      if (!cleaned) return cleaned;
      // SPEEDBIRD / AIR CANADA → Speedbird / Air Canada
      if (cleaned === cleaned.toUpperCase()) {
        return cleaned
          .toLowerCase()
          .replace(/\b\w/g, (c) => c.toUpperCase());
      }
      return cleaned;
    }

    /**
     * Look up ATC telephony callsign from 123atc.com for a 3-letter ICAO ID.
     * Example page: https://123atc.com/call-sign/BAW → "SPEEDBIRD"
     */
    async function lookup123atcCallsign(icao) {
      const key = String(icao || "").toUpperCase();
      if (!/^[A-Z]{3}$/.test(key)) return null;
      if (AIRLINES[key]) return AIRLINES[key];
      if (state.callsignCache.has(key)) return state.callsignCache.get(key);

      try {
        const cached = localStorage.getItem(`plane-cs-123atc-${key}`);
        if (cached) {
          state.callsignCache.set(key, cached);
          return cached;
        }
      } catch {}

      try {
        const res = await fetch(`https://r.jina.ai/https://123atc.com/call-sign/${key}`, {
          headers: { Accept: "application/json" },
          cache: "no-store",
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const wrap = await res.json();
        const title = wrap?.data?.title || "";
        // "BAW Call Sign SPEEDBIRD (British Airways)"
        const m = title.match(/Call Sign\s+(.+?)(?:\s*\(|$)/i);
        if (!m) {
          state.callsignCache.set(key, null);
          return null;
        }
        const name = titleCaseCallsign(m[1]);
        state.callsignCache.set(key, name);
        try {
          localStorage.setItem(`plane-cs-123atc-${key}`, name);
        } catch {}
        return name;
      } catch {
        state.callsignCache.set(key, null);
        return null;
      }
    }

    async function displayNameForCallsign(callsign, apiAirlineName) {
      const parsed = parseAirlineCallsign(callsign);
      if (!parsed) return callsign || null;

      // Prefer local seed → 123atc telephony → adsbdb airline name → raw ICAO
      const operator =
        AIRLINES[parsed.icao] ||
        (await lookup123atcCallsign(parsed.icao)) ||
        shortAirlineName(apiAirlineName) ||
        parsed.icao;

      return `${operator} ${parsed.flightNo}`;
    }

    async function lookupHexdbRoute(callsign) {
      const data = await fetchJson(
        `https://hexdb.io/api/v1/route/icao/${encodeURIComponent(callsign)}`
      );
      const route = (data?.route || "").toUpperCase();
      const m = route.match(/^([A-Z0-9]{3,4})-([A-Z0-9]{3,4})$/);
      if (!m) return null;
      return {
        from: m[1],
        to: m[2],
        fromCity: null,
        toCity: null,
        airline: null,
        source: "hexdb",
      };
    }

    async function lookupAdsbdbRoute(callsign) {
      const data = await fetchJson(
        `https://api.adsbdb.com/v0/callsign/${encodeURIComponent(callsign)}`
      );
      const route = data?.response?.flightroute;
      if (!route) return null;

      const from = route.origin?.icao_code || route.origin?.iata_code || null;
      const to =
        route.destination?.icao_code || route.destination?.iata_code || null;

      return {
        from,
        to,
        fromCity: route.origin?.municipality || route.origin?.name || null,
        toCity:
          route.destination?.municipality || route.destination?.name || null,
        airline: route.airline?.name || null,
        // Keep airport coords when present so we can score plausibility
        fromLat: route.origin?.latitude ?? null,
        fromLon: route.origin?.longitude ?? null,
        toLat: route.destination?.latitude ?? null,
        toLon: route.destination?.longitude ?? null,
        source: "adsbdb",
      };
    }

    function routeScore(route, plane) {
      // Prefer routes where the aircraft lies between origin and destination.
      if (
        !plane ||
        !Number.isFinite(plane.lat) ||
        !Number.isFinite(route?.fromLat) ||
        !Number.isFinite(route?.toLat)
      ) {
        return 0;
      }
      const dOd = haversineNm(route.fromLat, route.fromLon, route.toLat, route.toLon);
      const dOa = haversineNm(route.fromLat, route.fromLon, plane.lat, plane.lon);
      const dAd = haversineNm(plane.lat, plane.lon, route.toLat, route.toLon);
      if (!Number.isFinite(dOd) || dOd < 1) return 0;
      // Perfect on-path => ~0; far off-path => large
      const detour = dOa + dAd - dOd;
      return -detour;
    }

    async function lookupRoute(callsign, plane) {
      if (!callsign) return null;
      const key = callsign.toUpperCase().replace(/\s+/g, "");
      if (state.routeCache.has(key)) return state.routeCache.get(key);

      const settled = await Promise.allSettled([
        lookupHexdbRoute(key),
        lookupAdsbdbRoute(key),
      ]);
      const hexdb = settled[0].status === "fulfilled" ? settled[0].value : null;
      const adsbdb = settled[1].status === "fulfilled" ? settled[1].value : null;

      let info = null;

      if (hexdb?.from && hexdb?.to && adsbdb?.from && adsbdb?.to) {
        if (hexdb.from === adsbdb.from && hexdb.to === adsbdb.to) {
          // Agreement: use ICAO codes + city/airline enrichment
          info = {
            from: hexdb.from,
            to: hexdb.to,
            fromCity: adsbdb.fromCity,
            toCity: adsbdb.toCity,
            airline: adsbdb.airline,
            source: "hexdb+adsbdb",
          };
        } else {
          // Disagreement: keep adsbdb only if the aircraft looks roughly
          // on that path; otherwise prefer hexdb (common tar1090 source).
          const score = routeScore(adsbdb, plane);
          if (score > -40) {
            info = { ...adsbdb, source: "adsbdb" };
          } else {
            info = {
              ...hexdb,
              airline: adsbdb.airline,
              source: "hexdb",
            };
          }
        }
      } else if (hexdb?.from && hexdb?.to) {
        info = {
          ...hexdb,
          airline: adsbdb?.airline || null,
          source: "hexdb",
        };
      } else if (adsbdb?.from && adsbdb?.to) {
        info = { ...adsbdb, source: "adsbdb" };
      } else if (adsbdb?.airline) {
        info = {
          from: null,
          to: null,
          fromCity: null,
          toCity: null,
          airline: adsbdb.airline,
          source: "adsbdb-airline",
        };
      }

      state.routeCache.set(key, info);
      return info;
    }

    function fitTextOneLine(node) {
      if (!node) return;
      node.style.fontSize = "";
      let size = parseFloat(getComputedStyle(node).fontSize) || 16;
      node.style.fontSize = `${size}px`;
      while (size > 8 && node.scrollWidth > node.clientWidth + 1) {
        size -= 0.5;
        node.style.fontSize = `${size}px`;
      }
      return size;
    }

    function setCallsignAndRoute(callsignText, routeText) {
      el.callsign.textContent = callsignText || "Unknown";
      const csSize = fitTextOneLine(el.callsign);
      el.route.style.fontSize = `${Math.max(8, (csSize || 16) - 6)}px`;
      el.route.textContent = routeText || "";
      if (routeText) fitTextOneLine(el.route);
    }

    async function showPlane(index) {
      if (!state.planes.length) {
        el.card.classList.remove("visible");
        el.next.disabled = true;
        setStatus(
          `No aircraft nearby (${state.rawCount} raw in ${RADIUS_NM} nm at ${state.lat?.toFixed(4)}, ${state.lon?.toFixed(4)}).`,
          true
        );
        return;
      }

      state.index = ((index % state.planes.length) + state.planes.length) % state.planes.length;
      const p = state.planes[state.index];

      setStatus("");
      el.card.classList.add("visible");
      el.next.disabled = state.planes.length < 2;

      setCallsignAndRoute(
        (await displayNameForCallsign(p.callsign, null)) || p.registration || "Unknown",
        ""
      );

      el.type.textContent = p.typeDesc || p.typeCode || "—";
      el.alt.textContent = (() => {
        const base = `${fmtNum(p.alt)} ft`;
        if (p.vs == null) return base;
        if (p.vs > VERT_RATE_LEVEL_FPM) return `${base} ↑`;
        if (p.vs < -VERT_RATE_LEVEL_FPM) return `${base} ↓`;
        return base;
      })();
      el.speed.textContent = p.gs != null ? `${fmtNum(p.gs, 0)} kt` : "—";
      el.dist.textContent = (() => {
        const dist = `${fmtNum(p.dist, 1)} nm`;
        const dir = compassFromDeg(p.bearing);
        return dir ? `${dist} ${dir}` : dist;
      })();

      const route = await lookupRoute(p.callsign, p);
      if (state.planes[state.index] !== p) return;

      const name =
        (await displayNameForCallsign(p.callsign, route?.airline)) ||
        p.callsign ||
        p.registration ||
        "Unknown";
      const routeText =
        route?.from && route?.to ? `${route.from} → ${route.to}` : "";
      setCallsignAndRoute(name, routeText);
    }

    async function loadPlanes({ keepIndex = false, jumpToNearest = false } = {}) {
      if (state.lat == null || state.lon == null) return;

      const prevHex = keepIndex && state.planes[state.index]?.hex;
      el.refresh.disabled = true;
      el.nearest.disabled = true;

      try {
        const data = await fetchAircraftData(state.lat, state.lon);
        state.planes = planesFromResponse(data, state.lat, state.lon);

        let nextIndex = 0;
        if (!jumpToNearest && keepIndex && prevHex) {
          const found = state.planes.findIndex((p) => p.hex === prevHex);
          nextIndex = found >= 0 ? found : Math.min(state.index, Math.max(0, state.planes.length - 1));
        }

        await showPlane(nextIndex);
      } catch (err) {
        console.error(err);
        el.card.classList.remove("visible");
        el.next.disabled = true;
        setStatus("Could not load aircraft data. Try Refresh in a moment.", true);
      } finally {
        el.refresh.disabled = false;
        el.nearest.disabled = false;
      }
    }

    function noteInteraction() {
      state.lastInteractionAt = Date.now();
    }

    function shouldKeepSelection() {
      return (
        state.lastInteractionAt > 0 &&
        Date.now() - state.lastInteractionAt < LATCH_MS
      );
    }

    function startTimer() {
      clearInterval(state.timer);
      state.timer = setInterval(() => {
        // No recent button use → always show closest; otherwise latch selection
        loadPlanes({ keepIndex: shouldKeepSelection() });
      }, REFRESH_MS);
    }

    function isUsablePosition(lat, lon) {
      return (
        Number.isFinite(lat) &&
        Number.isFinite(lon) &&
        Math.abs(lat) <= 90 &&
        Math.abs(lon) <= 180 &&
        // 0,0 is almost always a missing/placeholder value from embeds
        !(lat === 0 && lon === 0)
      );
    }

    function setPosition(lat, lon, source = "manual", accuracyM = null) {
      let nextLat = Number(lat);
      let nextLon = Number(lon);
      let nextSource = source;

      if (!isUsablePosition(nextLat, nextLon)) {
        nextLat = DEFAULT_LAT;
        nextLon = DEFAULT_LON;
        nextSource = "default";
        accuracyM = null;
      }

      state.lat = nextLat;
      state.lon = nextLon;
      state.locationSource = nextSource;
      state.accuracyM = accuracyM;
      try {
        localStorage.setItem("plane-overhead-lat", String(nextLat));
        localStorage.setItem("plane-overhead-lon", String(nextLon));
      } catch {}
      el.setup.classList.remove("visible");
      loadPlanes();
      startTimer();
    }

    function ensureDefaultPosition() {
      if (!isUsablePosition(state.lat, state.lon)) {
        setPosition(DEFAULT_LAT, DEFAULT_LON, "default");
      }
    }

    function showManualSetup(message) {
      ensureDefaultPosition();
      setStatus(message, true);
      el.setup.classList.add("visible");
      el.lat.value = state.lat ?? DEFAULT_LAT;
      el.lon.value = state.lon ?? DEFAULT_LON;
    }

    /*
     * Browser geolocation — retained for future use (often blocked in iframes).
     * To re-enable: wire a button to requestGps() and/or call it on load.
     */
    function requestGps() {
      if (!navigator.geolocation) {
        ensureDefaultPosition();
        setStatus("GPS unavailable here — using default location.", true);
        return;
      }
      setStatus("Requesting GPS…");
      navigator.geolocation.getCurrentPosition(
        (pos) =>
          setPosition(
            pos.coords.latitude,
            pos.coords.longitude,
            "gps",
            pos.coords.accuracy
          ),
        (err) => {
          ensureDefaultPosition();
          const blocked =
            /permissions policy|secure origins|denied/i.test(err.message || "");
          setStatus(
            blocked
              ? "GPS blocked in this embed — using default location."
              : "GPS unavailable — using default location.",
            true
          );
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // Find nearest: refresh list and jump to closest aircraft
    el.nearest.addEventListener("click", () => {
      noteInteraction();
      loadPlanes({ jumpToNearest: true });
      startTimer();
    });

    // Refresh data for the currently selected aircraft
    el.refresh.addEventListener("click", () => {
      noteInteraction();
      loadPlanes({ keepIndex: true });
      startTimer();
    });

    // Next nearest in the sorted list
    el.next.addEventListener("click", () => {
      noteInteraction();
      showPlane(state.index + 1);
    });

    // Manual coordinate UI (hidden unless shown) — kept for future use
    el.useGps.addEventListener("click", () => requestGps());
    el.useLocation.addEventListener("click", () => {
      const lat = Number(el.lat.value);
      const lon = Number(el.lon.value);
      if (!isUsablePosition(lat, lon)) {
        setStatus("Enter valid latitude and longitude.", true);
        return;
      }
      setPosition(lat, lon, "manual");
    });

    // Always use the built-in default location (browser GPS disabled for now).
    setPosition(DEFAULT_LAT, DEFAULT_LON, "default");
  </script>
</body>
</html>
