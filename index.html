<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Nearest Plane</title>
  <style>
    :root {
      --bg: #111;
      --fg: #eee;
      --muted: #999;
      --line: #333;
      --btn: #2a2a2a;
      --btn-hover: #3a3a3a;
      --accent: #7eb8ff;
      /* Scales down aggressively in small embeds */
      --fs: clamp(6px, 2vh, 11px);
      --fs-title: clamp(8px, 3.4vh, 18px);
      --fs-route: clamp(7px, 2.4vh, 12px);
      --fs-small: clamp(5px, 1.6vh, 9px);
      --pad: clamp(2px, 0.8vh, 8px);
      --gap: clamp(1px, 0.5vh, 6px);
      --row-label: clamp(28px, 14vw, 48px);
      --btn-size: clamp(8px, 2.6vh, 12px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: var(--fs)/1.25 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: var(--pad);
      gap: var(--gap);
      min-height: 0;
    }
    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      -webkit-overflow-scrolling: touch;
    }
    #status {
      color: var(--muted);
      font-size: var(--fs-small);
    }
    #status.error { color: #f88; }
    #card { display: none; }
    #card.visible { display: block; }
    .callsign {
      font-size: var(--fs-title);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin: 0 0 var(--gap);
      overflow-wrap: anywhere;
    }
    .row {
      display: grid;
      grid-template-columns: var(--row-label) 1fr;
      gap: 1px var(--gap);
      margin: 1px 0;
      font-size: var(--fs);
    }
    .row .label { color: var(--muted); }
    .row .value {
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .route {
      margin-top: var(--gap);
      padding-top: var(--gap);
      border-top: 1px solid var(--line);
      font-size: var(--fs-route);
    }
    .route .airports {
      font-weight: 600;
      color: var(--accent);
      overflow-wrap: anywhere;
    }
    .route .cities {
      color: var(--muted);
      font-size: var(--fs-small);
      margin-top: 1px;
      overflow-wrap: anywhere;
    }
    footer {
      display: flex;
      gap: 3px;
      border-top: 1px solid var(--line);
      padding-top: 3px;
      flex: 0 0 auto;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--btn);
      color: var(--fg);
      font: inherit;
      font-weight: 600;
      padding: 4px 6px;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover { background: var(--btn-hover); }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    footer button.icon-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--btn-size) + 6px);
      min-height: 16px;
      max-height: 22px;
      padding: 2px;
      color: #fff;
      background: #1a1a1a;
      border-color: #444;
      line-height: 0;
    }
    footer button.icon-btn:hover {
      background: #2a2a2a;
    }
    footer button.icon-btn svg {
      width: var(--btn-size);
      height: var(--btn-size);
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #setup {
      display: none;
      flex-direction: column;
      gap: var(--gap);
    }
    #setup.visible { display: flex; }
    #setup label {
      font-size: var(--fs-small);
      color: var(--muted);
    }
    #setup input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid var(--line);
      color: var(--fg);
      padding: 4px;
      border-radius: 3px;
      font: inherit;
    }
  </style>
</head>
<body>
  <main>
    <div id="status"></div>

    <div id="setup">
      <label for="lat">Latitude</label>
      <input id="lat" type="number" step="any" placeholder="43.319" />
      <label for="lon">Longitude</label>
      <input id="lon" type="number" step="any" placeholder="-79.832" />
      <button type="button" id="use-location">Use these coordinates</button>
      <button type="button" id="use-gps">Request GPS location</button>
    </div>

    <div id="card">
      <p class="callsign" id="callsign">—</p>
      <div class="row"><span class="label">Type</span><span class="value" id="type">—</span></div>
      <div class="row"><span class="label">Alt</span><span class="value" id="alt">—</span></div>
      <div class="row"><span class="label">Speed</span><span class="value" id="speed">—</span></div>
      <div class="row"><span class="label">Pos</span><span class="value" id="dist">—</span></div>
      <div class="route">
        <div class="airports" id="route">—</div>
        <div class="cities" id="route-detail"></div>
      </div>
    </div>
  </main>

  <footer>
    <button type="button" class="icon-btn" id="nearest" aria-label="Nearest" title="Nearest">
      <!-- crosshair / find nearest -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7" />
        <circle cx="12" cy="12" r="2.25" fill="currentColor" stroke="none" />
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
      </svg>
    </button>
    <button type="button" class="icon-btn" id="refresh" aria-label="Refresh" title="Refresh">
      <!-- refresh -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.2-5.5" />
        <path d="M20 4v5h-5" />
      </svg>
    </button>
    <button type="button" class="icon-btn" id="next" aria-label="Next" title="Next" disabled>
      <!-- next -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 5l10 7-10 7V5z" />
        <path d="M19 5v14" />
      </svg>
    </button>
  </footer>

  <script>
    const RADIUS_NM = 150; // nautical miles (~173 mi). API max is typically 250.
    const REFRESH_MS = 30000;
    const MIN_ALT_FT = 200;
    const DEFAULT_LAT = 43.319;
    const DEFAULT_LON = -79.832;

    const ADSB_URLS = [
      (lat, lon) => `https://opendata.adsb.fi/api/v2/lat/${lat}/lon/${lon}/dist/${RADIUS_NM}`,
      (lat, lon) => `https://api.adsb.lol/v2/point/${lat}/${lon}/${RADIUS_NM}`,
    ];

    const el = {
      status: document.getElementById("status"),
      setup: document.getElementById("setup"),
      card: document.getElementById("card"),
      callsign: document.getElementById("callsign"),
      type: document.getElementById("type"),
      alt: document.getElementById("alt"),
      speed: document.getElementById("speed"),
      dist: document.getElementById("dist"),
      route: document.getElementById("route"),
      routeDetail: document.getElementById("route-detail"),
      next: document.getElementById("next"),
      refresh: document.getElementById("refresh"),
      nearest: document.getElementById("nearest"),
      lat: document.getElementById("lat"),
      lon: document.getElementById("lon"),
      useLocation: document.getElementById("use-location"),
      useGps: document.getElementById("use-gps"),
    };

    const state = {
      lat: null,
      lon: null,
      locationSource: null, // "gps" | "url" | "manual"
      accuracyM: null,
      planes: [],
      rawCount: 0,
      index: 0,
      timer: null,
      routeCache: new Map(),
    };

    function setStatus(msg, isError = false) {
      el.status.textContent = msg;
      el.status.classList.toggle("error", isError);
      el.status.style.display = msg ? "block" : "none";
    }

    function fmtNum(n, digits = 0) {
      if (n == null || Number.isNaN(n)) return "—";
      return Number(n).toLocaleString(undefined, {
        maximumFractionDigits: digits,
        minimumFractionDigits: digits,
      });
    }

    function haversineNm(lat1, lon1, lat2, lon2) {
      const toRad = (d) => (d * Math.PI) / 180;
      const R = 3440.065; // Earth radius in nautical miles
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function bearingDeg(lat1, lon1, lat2, lon2) {
      const toRad = (d) => (d * Math.PI) / 180;
      const toDeg = (r) => (r * 180) / Math.PI;
      const φ1 = toRad(lat1);
      const φ2 = toRad(lat2);
      const Δλ = toRad(lon2 - lon1);
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x =
        Math.cos(φ1) * Math.sin(φ2) -
        Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function compassFromDeg(deg) {
      if (!Number.isFinite(deg)) return null;
      const points = [
        "N", "NNE", "NE", "ENE",
        "E", "ESE", "SE", "SSE",
        "S", "SSW", "SW", "WSW",
        "W", "WNW", "NW", "NNW",
      ];
      const idx = Math.round(deg / 22.5) % 16;
      return points[idx];
    }

    function normalizePlane(raw, originLat, originLon) {
      const lat = raw.lat;
      const lon = raw.lon;
      if (lat == null || lon == null) return null;

      let alt = raw.alt_baro;
      if (alt === "ground") return null;
      alt = Number(alt);
      if (!Number.isFinite(alt)) {
        alt = Number(raw.alt_geom);
      }
      if (!Number.isFinite(alt) || alt < MIN_ALT_FT) return null;

      const callsign = (raw.flight || "").trim() || null;
      const registration = (raw.r || "").trim() || null;
      if (!callsign && !registration) return null;

      const gs = raw.gs != null ? Number(raw.gs) : null;
      let dist = raw.dst != null ? Number(raw.dst) : null;
      if (!Number.isFinite(dist)) {
        dist = haversineNm(originLat, originLon, lat, lon);
      }

      let bearing = raw.dir != null ? Number(raw.dir) : null;
      if (!Number.isFinite(bearing)) {
        bearing = bearingDeg(originLat, originLon, lat, lon);
      }

      const typeCode = (raw.t || "").trim() || null;
      const typeDesc = (raw.desc || "").trim() || null;

      return {
        hex: (raw.hex || "").toLowerCase(),
        callsign,
        registration,
        typeCode,
        typeDesc,
        alt,
        gs: Number.isFinite(gs) ? gs : null,
        dist,
        bearing,
        lat,
        lon,
      };
    }

    async function fetchJson(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    /** ADS-B APIs often omit CORS; jina.ai returns the body with CORS enabled. */
    async function fetchViaJina(url) {
      const res = await fetch(`https://r.jina.ai/${url}`, {
        headers: { Accept: "application/json" },
        cache: "no-store",
      });
      if (!res.ok) throw new Error(`Proxy HTTP ${res.status}`);
      const wrap = await res.json();
      const content = wrap?.data?.content;
      if (!content) throw new Error("Empty proxy response");
      return JSON.parse(content);
    }

    async function fetchAircraftData(lat, lon) {
      let lastError = null;
      for (const makeUrl of ADSB_URLS) {
        const url = makeUrl(lat, lon);
        try {
          return await fetchJson(url);
        } catch (err) {
          lastError = err;
        }
        try {
          return await fetchViaJina(url);
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("No aircraft data");
    }

    function planesFromResponse(data, lat, lon) {
      const list = data.aircraft || data.ac || [];
      state.rawCount = list.length;
      return list
        .map((raw) => normalizePlane(raw, lat, lon))
        .filter(Boolean)
        .sort((a, b) => a.dist - b.dist);
    }

    // ICAO airline designator → common / marketing name
    const AIRLINES = {
      JZA: "Jazz",
      ROU: "Rouge",
      ACA: "Air Canada",
      WJA: "WestJet",
      WEN: "WestJet Encore",
      TSC: "Air Transat",
      FLE: "Flair",
      POE: "Porter",
      PJT: "Porter",
      CAV: "Calm Air",
      PCO: "Pacific Coastal",
      CJT: "Cargojet",
      UAL: "United",
      AAL: "American",
      DAL: "Delta",
      SWA: "Southwest",
      JBU: "JetBlue",
      ASA: "Alaska",
      FFT: "Frontier",
      NKS: "Spirit",
      SCX: "Sun Country",
      HAL: "Hawaiian",
      MXY: "Breeze",
      SKW: "SkyWest",
      RPA: "Republic",
      ENY: "Envoy",
      PDT: "Piedmont",
      JIA: "PSA",
      ASH: "Mesa",
      GJS: "GoJet",
      EDV: "Endeavor",
      QXE: "Horizon",
      BAW: "British Airways",
      VIR: "Virgin Atlantic",
      AFR: "Air France",
      KLM: "KLM",
      DLH: "Lufthansa",
      EIN: "Aer Lingus",
      ICE: "Icelandair",
      SAS: "SAS",
      IBE: "Iberia",
      RYR: "Ryanair",
      EZY: "easyJet",
      EWG: "Eurowings",
      AUA: "Austrian",
      SWR: "Swiss",
      TAP: "TAP",
      FIN: "Finnair",
      LOT: "LOT",
      THY: "Turkish",
      UAE: "Emirates",
      QTR: "Qatar",
      ETD: "Etihad",
      SIA: "Singapore",
      CPA: "Cathay Pacific",
      ANA: "ANA",
      JAL: "JAL",
      QFA: "Qantas",
      ANZ: "Air New Zealand",
      AMX: "Aeromexico",
      CMP: "Copa",
      AVA: "Avianca",
      FDX: "FedEx",
      UPS: "UPS",
      GTI: "Atlas Air",
      EJA: "NetJets",
      LXJ: "Flexjet",
    };

    function shortAirlineName(name) {
      if (!name) return null;
      const n = String(name).trim();
      const aliases = [
        [/air canada rouge/i, "Rouge"],
        [/jazz aviation/i, "Jazz"],
        [/air canada express/i, "Jazz"],
        [/united airlines/i, "United"],
        [/american airlines/i, "American"],
        [/delta air lines/i, "Delta"],
        [/southwest airlines/i, "Southwest"],
        [/jetblue airways/i, "JetBlue"],
        [/westjet(?: airlines)?/i, "WestJet"],
        [/alaska airlines/i, "Alaska"],
      ];
      for (const [re, label] of aliases) {
        if (re.test(n)) return label;
      }
      return n
        .replace(/\s+(Airlines|Airline|Airways|Aviation|Ltd\.?|Limited|Inc\.?|LP|Corp\.?)\s*$/i, "")
        .trim();
    }

    function parseAirlineCallsign(callsign) {
      if (!callsign) return null;
      const cs = callsign.toUpperCase().replace(/\s+/g, "");
      // e.g. UAL1227, ACA601, JZA8591
      const m = cs.match(/^([A-Z]{3})(\d{1,4}[A-Z]?)$/);
      if (!m) return null;
      return { icao: m[1], flightNo: m[2] };
    }

    function displayNameForCallsign(callsign, apiAirlineName) {
      const parsed = parseAirlineCallsign(callsign);
      if (!parsed) return callsign || null;
      const operator =
        shortAirlineName(apiAirlineName) ||
        AIRLINES[parsed.icao] ||
        parsed.icao;
      return `${operator} ${parsed.flightNo}`;
    }

    async function lookupRoute(callsign) {
      if (!callsign) return null;
      const key = callsign.toUpperCase();
      if (state.routeCache.has(key)) return state.routeCache.get(key);

      try {
        const data = await fetchJson(
          `https://api.adsbdb.com/v0/callsign/${encodeURIComponent(key)}`
        );
        const route = data?.response?.flightroute;
        if (!route?.origin || !route?.destination) {
          state.routeCache.set(key, null);
          return null;
        }
        const info = {
          from: route.origin.icao_code || route.origin.iata_code,
          to: route.destination.icao_code || route.destination.iata_code,
          fromCity: route.origin.municipality || route.origin.name,
          toCity: route.destination.municipality || route.destination.name,
          airline: route.airline?.name || null,
        };
        state.routeCache.set(key, info);
        return info;
      } catch {
        state.routeCache.set(key, null);
        return null;
      }
    }

    async function showPlane(index) {
      if (!state.planes.length) {
        el.card.classList.remove("visible");
        el.next.disabled = true;
        setStatus(
          `No aircraft nearby (${state.rawCount} raw in ${RADIUS_NM} nm at ${state.lat?.toFixed(4)}, ${state.lon?.toFixed(4)}).`,
          true
        );
        return;
      }

      state.index = ((index % state.planes.length) + state.planes.length) % state.planes.length;
      const p = state.planes[state.index];

      setStatus("");
      el.card.classList.add("visible");
      el.next.disabled = state.planes.length < 2;

      el.callsign.textContent =
        displayNameForCallsign(p.callsign, null) || p.registration || "Unknown";

      el.type.textContent = p.typeDesc || p.typeCode || "—";
      el.alt.textContent = `${fmtNum(p.alt)} ft`;
      el.speed.textContent = p.gs != null ? `${fmtNum(p.gs, 0)} kt` : "—";
      el.dist.textContent = (() => {
        const dist = `${fmtNum(p.dist, 1)} nm`;
        const dir = compassFromDeg(p.bearing);
        return dir ? `${dist} ${dir}` : dist;
      })();

      el.route.textContent = "Looking up route…";
      el.routeDetail.textContent = "";

      const route = await lookupRoute(p.callsign);
      if (state.planes[state.index] !== p) return;

      if (route?.airline) {
        el.callsign.textContent =
          displayNameForCallsign(p.callsign, route.airline) ||
          p.callsign ||
          p.registration ||
          "Unknown";
      }

      if (route?.from && route?.to) {
        el.route.textContent = `${route.from} → ${route.to}`;
        el.routeDetail.textContent =
          route.fromCity && route.toCity ? `${route.fromCity} to ${route.toCity}` : "";
      } else {
        el.route.textContent = "Route unknown";
        el.routeDetail.textContent = p.callsign
          ? "No scheduled route found for this callsign"
          : "Needs a callsign to look up route";
      }
    }

    async function loadPlanes({ keepIndex = false, jumpToNearest = false } = {}) {
      if (state.lat == null || state.lon == null) return;

      const prevHex = keepIndex && state.planes[state.index]?.hex;
      el.refresh.disabled = true;
      el.nearest.disabled = true;

      try {
        const data = await fetchAircraftData(state.lat, state.lon);
        state.planes = planesFromResponse(data, state.lat, state.lon);

        let nextIndex = 0;
        if (!jumpToNearest && keepIndex && prevHex) {
          const found = state.planes.findIndex((p) => p.hex === prevHex);
          nextIndex = found >= 0 ? found : Math.min(state.index, Math.max(0, state.planes.length - 1));
        }

        await showPlane(nextIndex);
      } catch (err) {
        console.error(err);
        el.card.classList.remove("visible");
        el.next.disabled = true;
        setStatus("Could not load aircraft data. Try Refresh in a moment.", true);
      } finally {
        el.refresh.disabled = false;
        el.nearest.disabled = false;
      }
    }

    function startTimer() {
      clearInterval(state.timer);
      state.timer = setInterval(() => loadPlanes({ keepIndex: true }), REFRESH_MS);
    }

    function isUsablePosition(lat, lon) {
      return (
        Number.isFinite(lat) &&
        Number.isFinite(lon) &&
        Math.abs(lat) <= 90 &&
        Math.abs(lon) <= 180 &&
        // 0,0 is almost always a missing/placeholder value from embeds
        !(lat === 0 && lon === 0)
      );
    }

    function setPosition(lat, lon, source = "manual", accuracyM = null) {
      let nextLat = Number(lat);
      let nextLon = Number(lon);
      let nextSource = source;

      if (!isUsablePosition(nextLat, nextLon)) {
        nextLat = DEFAULT_LAT;
        nextLon = DEFAULT_LON;
        nextSource = "default";
        accuracyM = null;
      }

      state.lat = nextLat;
      state.lon = nextLon;
      state.locationSource = nextSource;
      state.accuracyM = accuracyM;
      try {
        localStorage.setItem("plane-overhead-lat", String(nextLat));
        localStorage.setItem("plane-overhead-lon", String(nextLon));
      } catch {}
      el.setup.classList.remove("visible");
      loadPlanes();
      startTimer();
    }

    function ensureDefaultPosition() {
      if (!isUsablePosition(state.lat, state.lon)) {
        setPosition(DEFAULT_LAT, DEFAULT_LON, "default");
      }
    }

    function showManualSetup(message) {
      ensureDefaultPosition();
      setStatus(message, true);
      el.setup.classList.add("visible");
      el.lat.value = state.lat ?? DEFAULT_LAT;
      el.lon.value = state.lon ?? DEFAULT_LON;
    }

    /*
     * Browser geolocation — retained for future use (often blocked in iframes).
     * To re-enable: wire a button to requestGps() and/or call it on load.
     */
    function requestGps() {
      if (!navigator.geolocation) {
        ensureDefaultPosition();
        setStatus("GPS unavailable here — using default location.", true);
        return;
      }
      setStatus("Requesting GPS…");
      navigator.geolocation.getCurrentPosition(
        (pos) =>
          setPosition(
            pos.coords.latitude,
            pos.coords.longitude,
            "gps",
            pos.coords.accuracy
          ),
        (err) => {
          ensureDefaultPosition();
          const blocked =
            /permissions policy|secure origins|denied/i.test(err.message || "");
          setStatus(
            blocked
              ? "GPS blocked in this embed — using default location."
              : "GPS unavailable — using default location.",
            true
          );
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // Find nearest: refresh list and jump to closest aircraft
    el.nearest.addEventListener("click", () => {
      loadPlanes({ jumpToNearest: true });
      startTimer();
    });

    // Refresh data for the currently selected aircraft
    el.refresh.addEventListener("click", () => {
      loadPlanes({ keepIndex: true });
      startTimer();
    });

    // Next nearest in the sorted list
    el.next.addEventListener("click", () => {
      showPlane(state.index + 1);
    });

    // Manual coordinate UI (hidden unless shown) — kept for future use
    el.useGps.addEventListener("click", () => requestGps());
    el.useLocation.addEventListener("click", () => {
      const lat = Number(el.lat.value);
      const lon = Number(el.lon.value);
      if (!isUsablePosition(lat, lon)) {
        setStatus("Enter valid latitude and longitude.", true);
        return;
      }
      setPosition(lat, lon, "manual");
    });

    // Always use the built-in default location (browser GPS disabled for now).
    setPosition(DEFAULT_LAT, DEFAULT_LON, "default");
  </script>
</body>
